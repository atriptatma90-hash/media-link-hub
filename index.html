<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Media Link Hub — Anime · Software · AI · Movies</title>
  <meta name="description" content="An auto-updating directory of curated links for Anime, Software, AI, and Movies." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">◆</span>
      <span>Media Link Hub</span>
    </div>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search links…  (press /)" autocomplete="off" />
    </div>
    <a class="src" href="https://github.com/fmhy/edit" target="_blank" rel="noopener">data source ↗</a>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <main id="content">
    <p class="loading">Loading links…</p>
  </main>

  <footer class="footer">
    <span id="meta"></span>
    <span class="disclaimer">Aggregated from the open-source FMHY dataset. Links point to third-party sites; use responsibly.</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
